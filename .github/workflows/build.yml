name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  schedule:
    - cron: "0 0 * * 0"  # Runs every Sunday at midnight UTC

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          # Pinned: Homebrew bottles on macos-latest (macOS 26) carry
          # minos 26.0, which delocate rejects against the 15.0 wheel
          # target below. Keep this image and MACOSX_DEPLOYMENT_TARGET
          # in sync if either changes.
          - macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install gfortran (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc || brew link --overwrite gcc
          echo "$(brew --prefix gcc)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix gcc)/bin/gfortran" --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install "numpy==2.5.1" "cibuildwheel==4.2.0"

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheels
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: arm64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ENVIRONMENT_MACOS: "PATH=/opt/homebrew/bin:$PATH MACOSX_DEPLOYMENT_TARGET=15.0"

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheels/*.whl
