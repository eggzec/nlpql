<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
     width="512" height="512" role="img"
     aria-labelledby="nlpql-title nlpql-desc">
  <title id="nlpql-title">NLPQL</title>
  <desc id="nlpql-desc">Elliptic contour lines of a quadratic model,
    a linearized constraint and a sequence of iterates converging to a
    constrained minimum.</desc>

  <defs>
    <!-- background of the rounded tile -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37474f"/>
      <stop offset="0.55" stop-color="#263238"/>
      <stop offset="1" stop-color="#161d21"/>
    </linearGradient>

    <!-- contour lines of the quadratic model -->
    <linearGradient id="contour" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4dd0e1"/>
      <stop offset="1" stop-color="#0288d1"/>
    </linearGradient>

    <!-- the linearized constraint -->
    <linearGradient id="cut" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb74d"/>
      <stop offset="1" stop-color="#ff7043"/>
    </linearGradient>

    <!-- path of the iterates -->
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b0bec5"/>
      <stop offset="1" stop-color="#eceff1"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#4dd0e1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4dd0e1" stop-opacity="0"/>
    </radialGradient>

    <!-- faint coordinate grid -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff"
            stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <clipPath id="tileclip">
      <rect x="16" y="16" width="480" height="480" rx="104" ry="104"/>
    </clipPath>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" ry="104"
        fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" ry="104"
        fill="url(#grid)"/>

  <g clip-path="url(#tileclip)">

    <!-- infeasible half plane, cut off by the linearized constraint -->
    <path d="M0 487 L512 86 L512 512 L0 512 Z"
          fill="#ff7043" fill-opacity="0.07"/>

    <!-- contour lines of the quadratic approximation -->
    <g transform="rotate(-32 343 307)" fill="none"
       stroke="url(#contour)" stroke-linecap="round">
      <ellipse cx="343" cy="307" rx="230" ry="168"
               stroke-width="5" stroke-opacity="0.22"/>
      <ellipse cx="343" cy="307" rx="188" ry="137"
               stroke-width="5" stroke-opacity="0.32"/>
      <ellipse cx="343" cy="307" rx="147" ry="107"
               stroke-width="5.5" stroke-opacity="0.45"/>
      <ellipse cx="343" cy="307" rx="107" ry="78"
               stroke-width="6" stroke-opacity="0.6"/>
      <ellipse cx="343" cy="307" rx="70" ry="51"
               stroke-width="6.5" stroke-opacity="0.8"/>
      <ellipse cx="343" cy="307" rx="36" ry="26"
               stroke-width="7" stroke-opacity="0.95"/>
    </g>

    <!-- glow around the solution -->
    <circle cx="300" cy="252" r="96" fill="url(#glow)"/>

    <!-- the linearized constraint, tangent to the innermost contour -->
    <line x1="24" y1="468" x2="488" y2="104"
          stroke="#000000" stroke-opacity="0.35" stroke-width="16"
          stroke-linecap="round" filter="url(#soft)"/>
    <line x1="24" y1="468" x2="488" y2="104"
          stroke="url(#cut)" stroke-width="11" stroke-linecap="round"/>

    <!-- sequence of iterates, the steps shrink superlinearly -->
    <polyline points="118,132 196,196 252,232 285,246 300,252"
              fill="none" stroke="#000000" stroke-opacity="0.35"
              stroke-width="13" stroke-linecap="round"
              stroke-linejoin="round" filter="url(#soft)"/>
    <polyline points="118,132 196,196 252,232 285,246 300,252"
              fill="none" stroke="url(#path)" stroke-width="8"
              stroke-linecap="round" stroke-linejoin="round"/>

    <g fill="#eceff1" stroke="#263238" stroke-width="4">
      <circle cx="118" cy="132" r="16"/>
      <circle cx="196" cy="196" r="12.5"/>
      <circle cx="252" cy="232" r="9.5"/>
      <circle cx="285" cy="246" r="7"/>
    </g>

    <!-- the constrained minimum -->
    <circle cx="300" cy="252" r="21" fill="#263238"/>
    <circle cx="300" cy="252" r="15" fill="#ffd54f"/>
    <circle cx="300" cy="252" r="6.5" fill="#ffffff"/>
  </g>

  <!-- rim -->
  <rect x="16" y="16" width="480" height="480" rx="104" ry="104"
        fill="none" stroke="#ffffff" stroke-opacity="0.10"
        stroke-width="3"/>
</svg>
