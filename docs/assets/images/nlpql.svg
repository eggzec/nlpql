<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
     width="512" height="512" role="img"
     aria-labelledby="nlpql-title nlpql-desc">
  <title id="nlpql-title">NLPQL</title>
  <desc id="nlpql-desc">Elliptic contour lines of a quadratic model,
    a linearized constraint and a sequence of iterates converging to a
    constrained minimum.</desc>

  <defs>
    <!-- light background of the rounded tile -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4f8fb"/>
      <stop offset="1" stop-color="#e3ebf2"/>
    </linearGradient>

    <!-- contour lines of the quadratic model -->
    <linearGradient id="contour" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26c6da"/>
      <stop offset="1" stop-color="#1565c0"/>
    </linearGradient>

    <!-- the linearized constraint -->
    <linearGradient id="cut" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffa726"/>
      <stop offset="1" stop-color="#ef5350"/>
    </linearGradient>

    <!-- path of the iterates -->
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78909c"/>
      <stop offset="1" stop-color="#37474f"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#4dd0e1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4dd0e1" stop-opacity="0"/>
    </radialGradient>

    <!-- faint coordinate grid -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5b7183"
            stroke-opacity="0.12" stroke-width="1"/>
    </pattern>

    <clipPath id="tileclip">
      <rect x="16" y="16" width="480" height="480" rx="104" ry="104"/>
    </clipPath>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" ry="104"
        fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" ry="104"
        fill="url(#grid)"/>

  <g clip-path="url(#tileclip)">

    <!-- infeasible half plane, cut off by the linearized constraint -->
    <path d="M0 487 L512 86 L512 512 L0 512 Z"
          fill="#ef5350" fill-opacity="0.10"/>

    <!-- contour lines of the quadratic approximation -->
    <g transform="rotate(-38 343 307)" fill="none"
       stroke="url(#contour)" stroke-linecap="round">
      <ellipse cx="343" cy="307" rx="219" ry="160"
               stroke-width="5" stroke-opacity="0.28"/>
      <ellipse cx="343" cy="307" rx="173" ry="126"
               stroke-width="5" stroke-opacity="0.40"/>
      <ellipse cx="343" cy="307" rx="132" ry="96"
               stroke-width="5.5" stroke-opacity="0.54"/>
      <!-- this contour touches the constraint at the solution -->
      <ellipse cx="343" cy="307" rx="96" ry="70"
               stroke-width="7.5" stroke-opacity="0.92"/>
      <ellipse cx="343" cy="307" rx="63" ry="46"
               stroke-width="6" stroke-opacity="0.78"/>
      <ellipse cx="343" cy="307" rx="33" ry="24"
               stroke-width="6.5" stroke-opacity="1"/>
    </g>

    <!-- glow around the solution -->
    <circle cx="300" cy="252" r="96" fill="url(#glow)"/>

    <!-- the linearized constraint, tangent to a contour at the solution -->
    <line x1="24" y1="468" x2="488" y2="104"
          stroke="#8a99a6" stroke-opacity="0.30" stroke-width="15"
          stroke-linecap="round" filter="url(#soft)"/>
    <line x1="24" y1="468" x2="488" y2="104"
          stroke="url(#cut)" stroke-width="11" stroke-linecap="round"/>

    <!-- sequence of iterates, the steps shrink superlinearly -->
    <polyline points="118,132 196,196 252,232 285,246 300,252"
              fill="none" stroke="#8a99a6" stroke-opacity="0.30"
              stroke-width="12" stroke-linecap="round"
              stroke-linejoin="round" filter="url(#soft)"/>
    <polyline points="118,132 196,196 252,232 285,246 300,252"
              fill="none" stroke="url(#path)" stroke-width="8"
              stroke-linecap="round" stroke-linejoin="round"/>

    <g fill="#ffffff" stroke="#37474f" stroke-width="5">
      <circle cx="118" cy="132" r="16"/>
      <circle cx="196" cy="196" r="12.5"/>
      <circle cx="252" cy="232" r="9.5"/>
      <circle cx="285" cy="246" r="7"/>
    </g>

    <!-- the constrained minimum -->
    <circle cx="300" cy="252" r="22" fill="#ffffff"/>
    <circle cx="300" cy="252" r="17" fill="#ffb300"/>
    <circle cx="300" cy="252" r="7.5" fill="#ffffff"/>
  </g>

  <!-- rim -->
  <rect x="16" y="16" width="480" height="480" rx="104" ry="104"
        fill="none" stroke="#b0bec5" stroke-opacity="0.75"
        stroke-width="3"/>
</svg>
