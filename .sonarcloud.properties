# SonarQube Cloud analysis scope.
#
# Analyse application source only. Tests, build tooling, documentation
# and CI workflow definitions are never shipped in the published
# package, so findings there fail the quality gate without describing
# any risk to users of a project generated from this template.
#
# Every path listed below was verified to exist here. If a generated
# project drops or adds one of these directories, update this list to
# match rather than carrying entries for directories that do not exist.
#
# Filename matters: projects using SonarQube Cloud Automatic Analysis
# read .sonarcloud.properties. sonar-project.properties is read only
# by CI-based analysis (the sonarqube-scan-action) and is otherwise
# silently ignored.
sonar.exclusions=.github/**,tests/**,bin/**,docs/**
